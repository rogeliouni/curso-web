<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>3D transforms</title>
        <style>
            .bluebox {
                background-color: #3A5795;
                color: white;
                height: 100px;
                width: 100px;
                /* transform: rotateX(30deg); */
                transform: rotateY(30deg);
            }
            .yellowbox {
                background-color: rgb(222, 224, 85);
                height: 100px;
                width: auto;
            }
            .greenbox {
                background-color: #31af37;
                height: 100px;
                width: auto;
            }
        </style>
    </head>

    <body>
        <!-- Nota: sin "perspective" el giro 3D se ve plano. Pruebalo en los experimentos. -->
        <div class="bluebox">
            <p>Facebook.</p>
        </div>
        <div class="yellowbox">
            <p>Apple.</p>
        </div>
        <div class="greenbox">
            <p>Microsoft.</p>
        </div>
    </body>

</html>
